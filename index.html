
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Display and export product information">
  <title>E-Commerce Product Extractor</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="hero">
    <h1>Product Data Extractor</h1>
    <p>Collect, display and export product information</p>
  </header>

  <main class="container">
    <section class="toolbar">
      <h2>Product Dashboard</h2>

      <label for="apiUrl">Authorized Product JSON URL</label>

      <div class="input-row">
        <input
          id="apiUrl"
          type="url"
          placeholder="https://example.com/api/products"
          autocomplete="url"
        >
        <button id="loadBtn" type="button">Load Data</button>
      </div>

      <div class="button-row">
        <button id="demoBtn" class="secondary" type="button">
          Load Demo Products
        </button>
        <button id="csvBtn" class="export" type="button">
          Download CSV
        </button>
      </div>

      <p id="status" role="status" aria-live="polite">
        Loading demo products...
      </p>
    </section>

    <section class="stats" aria-label="Product statistics">
      <div class="stat-box">
        <span>Total Products</span>
        <strong id="totalProducts">0</strong>
      </div>

      <div class="stat-box">
        <span>Average Rating</span>
        <strong id="averageRating">0.0 ★</strong>
      </div>
    </section>

    <section
      id="productGrid"
      class="product-grid"
      aria-label="Product list"
    ></section>
  </main>

  <footer>
    <p>Product Extractor | HTML, CSS and JavaScript</p>
  </footer>

</body>
</html>
